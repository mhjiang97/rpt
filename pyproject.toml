[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpt"
version = "0.1.0"
description = "Generate a PDF report from VCFs produced by SMK_SV"
authors = [
    {name = "Minghao Jiang",email = "mjhk@connect.hku.hk"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "oxbow>=0.4.1",
    "polars>=1.32.3",
    "preppy>=5.0.1",
    "reportlab>=4.4.3",
    "rlextra>=4.4.3",
    # rlextra needs rlCgi on Python >= 3.13; it is not on PyPI, only on ReportLab's index.
    "rlcgi>=2.6.1; python_version >= '3.13'",
    "typer>=0.16.1",
]
license = "GPL-3.0-or-later"

[project.scripts]
rpt = "rpt.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpt = ["*.prep", "*.json"]

# rlextra (ReportLab PLUS) is only published on ReportLab's own index.
[[tool.uv.index]]
name = "reportlab"
url = "https://www.reportlab.com/pypi/simple/"
explicit = true

[tool.uv.sources]
rlextra = { index = "reportlab" }
rlcgi = { index = "reportlab" }
